spring:
  application:
    name: fafsaeditprocessor
  mvc:
    # Return errors as RFC 7807 problem details (JSON with type, title, status, detail)
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    # Spring Boot's fallback error response (e.g. an unexpected 500) must not reveal the request path
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fafsa:
  rules:
    # Rule set loaded at startup. Point at an external file with
    # FAFSA_RULES_LOCATION=file:/path/to/rules.yaml to change rules without rebuilding (restart needed).
    location: classpath:rules/fafsa-2026-27.yaml
  validation:
    max-batch-size: 1000
  engine:
    parallel:
      # Run one application's rules concurrently once a rule set has at least this many rules
      # (0 = never). Measured break-even is about 15-30 rules; below that, handing rules to other
      # threads costs more than it saves (7 rules: 12 us one after another, 20 us in parallel).
      min-rules: 50
      # Threads for parallel rule evaluation; 0 = one per CPU core
      threads: 0

logging:
  pattern:
    # Adds [requestId] to every log line (set by RequestIdFilter; empty outside a request)
    level: "%5p [%X{requestId:-}]"
  level:
    com.fafsa.editprocessor: INFO
