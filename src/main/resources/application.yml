spring:
  application:
    name: fafsaeditprocessor
  mvc:
    # Return errors as RFC 7807 problem details (JSON with type, title, status, detail)
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    # Spring Boot's fallback error response (e.g. an unexpected 500) must not reveal the request path
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fafsa:
  rules:
    # Rule set loaded at startup (Step 8). Point at an external file with
    # FAFSA_RULES_LOCATION=file:/path/to/rules.yaml to change rules without rebuilding.
    location: classpath:rules/fafsa-2026-27.yaml
    # Where rule sets activated through the admin API are saved, so restarts keep them.
    storage-dir: ./data/rulesets
  validation:
    max-batch-size: 1000

logging:
  pattern:
    # Adds [requestId] to every log line (set by RequestIdFilter; empty outside a request)
    level: "%5p [%X{requestId:-}]"
  level:
    com.fafsa.editprocessor: INFO
