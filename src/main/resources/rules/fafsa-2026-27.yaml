# FAFSA edit rules, 2026-27 cycle.
# Written in CEL (https://cel.dev). See RULE_AUTHORING.md for the format.
#
# Step 7: add the 7 required rules here, each with its own `tests`.
#   1. STUDENT_AGE               student is at least 14
#   2. SSN_FORMAT                SSN is exactly 9 digits
#   3. DEPENDENT_PARENT_INCOME   parent income required when dependent
#   4. NON_NEGATIVE_INCOME       income values are not negative
#   5. HOUSEHOLD_COLLEGE_COUNT   numberInCollege <= numberInHousehold
#   6. STATE_CODE                valid US state abbreviation
#   7. MARRIED_SPOUSE_INFO       spouse info required when married

